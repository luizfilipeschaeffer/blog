services:
  postgres:
    image: postgres:16-alpine
    container_name: ssr-blog-kit-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: ssr_blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d ssr_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
